name: end-to-end tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'doc/**'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  FIG_INSECURE_SSL: '1'

jobs:
  e2e:
    name: playwright-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup PowerShell
      shell: bash
      run: |
        if ! command -v pwsh >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y powershell
        fi

    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/Fig.EndToEnd.Tests.csproj') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Restore
      run: dotnet restore ./src/tests/Fig.EndToEnd.Tests/Fig.EndToEnd.Tests.csproj

    - name: Build
      run: dotnet build ./src/tests/Fig.EndToEnd.Tests/Fig.EndToEnd.Tests.csproj --configuration Release --no-restore

    - name: Install Playwright OS dependencies
      run: pwsh ./src/tests/Fig.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 install-deps chromium

    - name: Generate HTTPS developer certificate
      run: dotnet dev-certs https

    - name: Run End-to-End Tests
      run: >
        dotnet test ./src/tests/Fig.EndToEnd.Tests/Fig.EndToEnd.Tests.csproj
        --configuration Release
        --no-build
        --no-restore
        --filter "Category=E2E&FullyQualifiedName!~DashboardPlaywrightTests"
        --logger "trx;LogFileName=e2e-test-results.trx"
        --results-directory ./src/tests/Fig.EndToEnd.Tests/TestResults
        --verbosity normal
      timeout-minutes: 35
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          src/tests/Fig.EndToEnd.Tests/TestResults/**
          **/playwright-report/**
          **/test-results/**
        if-no-files-found: warn
